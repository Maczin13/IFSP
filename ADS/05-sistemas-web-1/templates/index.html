<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plano de estudos</title><style>body{font-family:system-ui;max-width:720px;margin:2rem auto;padding:0 1rem;line-height:1.5}input,button{font:inherit;padding:.5rem}li{margin:.7rem 0}.done{text-decoration:line-through;color:#555}.error{border:2px solid #b00020;padding:.7rem}button{cursor:pointer}</style></head>
<body><main><h1>Plano de estudos</h1><p>Cadastro local de tarefas para demonstrar MVC, HTTP, persistência e validação.</p>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('create_task') }}"><label for="title">Nova tarefa</label><input id="title" name="title" maxlength="120" required aria-describedby="title-help"><small id="title-help">Até 120 caracteres.</small><button type="submit">Adicionar</button></form>
<h2>Tarefas</h2><ul>{% for task in tasks %}<li class="{{ 'done' if task['done'] else '' }}"><span>{{ task['title'] }}</span><form method="post" action="{{ url_for('toggle_task',task_id=task['id']) }}" style="display:inline"><button type="submit" aria-label="Alternar conclusão de {{ task['title'] }}">{{ 'Reabrir' if task['done'] else 'Concluir' }}</button></form></li>{% else %}<li>Nenhuma tarefa cadastrada.</li>{% endfor %}</ul></main></body></html>
